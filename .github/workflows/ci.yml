name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml is 3.9; 3.10/3.12 are the versions the
        # scientific stack still ships wheels for on a clean runner.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-image pillow pytest
          python -m pip install --no-deps -e .

      - name: Optional SVG renderer for the compression round-trip
        run: |
          python -m pip install cairosvg || echo "cairosvg unavailable; selfcheck.py skips that section"

      - name: Self-check
        run: python selfcheck.py

      - name: Test suite
        # The byte-identity anchors need the gitignored inputs/ images and skip loudly without
        # them; the rest of the suite runs on small crops.  Selfcheck above already covers the
        # end-to-end pipeline.  Run `pytest -m slow` locally (with inputs/) for the md5 anchors.
        run: python -m pytest -q

      - name: Console script
        run: svg-tracer --version
