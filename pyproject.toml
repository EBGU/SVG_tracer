[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SVG_tracer"
version = "1.0.0"
description = "Trace raster images into compact SVG: color regions + gradients + structure-tensor strokes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["svg", "vectorization", "image-tracing", "structure-tensor", "painting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Vectorization",
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "Pillow",
]

[project.optional-dependencies]
# render-back verification: preview images, `svgzip.py --ref` PSNR checks and selfcheck.py's
# compression round-trip all need an SVG rasterizer
render = ["cairosvg"]
gpu = ["cupy-cuda12x"]

[project.scripts]
svg-tracer = "svg_tracer.cli:main"

[tool.setuptools]
# the split package, the program entry point and the standalone helper modules
py-modules = ["SVG_tracer", "gpu_backend", "cuda_backend", "svg_slim", "svgzip", "selfcheck"]
packages = ["svg_tracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: full-size byte-identity anchors and the self-check; they need the inputs/ images",
]
